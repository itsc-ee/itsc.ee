er Recovery Readiness</text><text x="700" y="715" class="small" text-anchor="middle">    Production recovery workflows with repeatable and validated </text><text x="700" y="740" class="small" text-anchor="middle">    restore procedures.</text><text x="700" y="765" class="small" text-anchor="middle">      </text><path d="M370 380 C410 380 425 380 465 380" stroke="#0F172A" stroke-width="3" marker-end="url(#arrow)"></path><path d="M800 320 C850 320 850 270 895 270" stroke="#0F172A" stroke-width="3" marker-end="url(#arrow)"></path><path d="M1075 350 L1075 385" stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"></path><path d="M900 510 C830 610 760 635 720 655" stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"></path><path d="M580 590 C600 620 630 640 680 655" stroke="#0F172A" stroke-width="3" marker-end="url(#arrow)"></path></svg>
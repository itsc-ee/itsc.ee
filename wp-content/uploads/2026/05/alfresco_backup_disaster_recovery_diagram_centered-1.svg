<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" fill="none"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></marker><style>      .title{font:700 36px Arial,sans-serif;fill:#0F172A}      .subtitle{font:500 17px Arial,sans-serif;fill:#475569}      .label{font:700 21px Arial,sans-serif;fill:#0F172A}      .small{font:500 15px Arial,sans-serif;fill:#475569}      .tiny{font:600 13px Arial,sans-serif;fill:#64748B}      .chip{font:700 13px Arial,sans-serif;fill:#334155}    </style></defs><rect width="1400" height="820" fill="#FCFCFD"></rect><text x="70" y="70" class="title">Alfresco Backup &amp; Disaster Recovery Automation</text><text x="70" y="102" class="subtitle">    Incremental backups, restore validation and production recovery workflows for Alfresco ECM infrastructure.  </text><rect x="70" y="160" width="300" height="430" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)"></rect><text x="105" y="205" class="label">Alfresco ECM</text><text x="105" y="232" class="small">Production data sources</text><rect x="105" y="270" width="230" height="70" rx="16" fill="white" stroke="#BFDBFE"></rect><text x="135" y="300" class="small">Content Store</text><text x="135" y="322" class="tiny">Files and documents</text><rect x="105" y="365" width="230" height="70" rx="16" fill="white" stroke="#BFDBFE"></rect><text x="135" y="395" class="small">Apache SOLR</text><text x="135" y="417" class="tiny">Indexes and search data</text><rect x="105" y="460" width="230" height="70" rx="16" fill="white" stroke="#BFDBFE"></rect><text x="135" y="490" class="small">PostgreSQL</text><text x="135" y="512" class="tiny">Metadata database</text><rect x="470" y="160" width="330" height="430" rx="